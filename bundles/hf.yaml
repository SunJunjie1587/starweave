- insert:
    - id: model
      plugin: model-hf
      config:
        name_or_path: Qwen/Qwen3-0.6B
        dtype: bfloat16
        tokenizer: null

    - id: data
      plugin: data-jsonl
      config:
        path: data/sft_dsv4.jsonl
        max_seq_len: 1024
        batch_size: 1

    - id: inference
      plugin: inference-hf
      config: {max_new_tokens: 256, temperature: 0.7, top_p: 0.9, batch_size: 1}
