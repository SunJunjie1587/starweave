- insert:
    - id: task
      plugin: task-rl
      config: {max_steps: 10, prompts_per_step: 1, group_size: 2, max_new_tokens: 16, update_epochs: 1}

    - id: rollout
      plugin: rollout-hf
      config:
        max_new_tokens: 16
        temperature: 0.8
        top_p: 0.95
        do_sample: true
        use_cache: false

    - id: reward
      plugin: reward-rule
      config: {reference_field: reference, match_reward: 1.0, length_reward: 0.01, token_reward: 0.001}

    - id: algorithm
      plugin: algorithm-grpo
      config: {group_size: 2}

    - id: optimizer
      plugin: optimizer-adamw
      config: {lr: 1.0e-4, weight_decay: 0.01, betas: [0.9, 0.95]}

    - id: scheduler
      plugin: scheduler-cosine
      config: {warmup_ratio: 0.0, min_lr_ratio: 1.0}

- id: data
  plugin: data-rl-jsonl
  config:
    path: data/rl_prompts.jsonl
    max_seq_len: 512
    batch_size: 1
    prompt_field: prompt
    response_field: reference
